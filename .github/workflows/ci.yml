name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    # Matrixed job: each leg runs exactly one test type. This is the MySQL
    # edition of the ORM, so the integration leg targets mysql:8.0 (MySQL 8
    # defaults to the utf8mb4 character set). The hermetic integration tests
    # additionally spin up their own testcontainers mysql:8.0 instance with
    # --character-set-server=utf8mb4 --collation-server=utf8mb4_bin for
    # per-run isolation.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: g4public
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            matrix: unit
          - name: Integration tests
            matrix: integration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e '.[test,mysql]'

      - name: Run unit tests
        if: matrix.matrix == 'unit'
        run: |
          uv run pytest tests/unit

      - name: Run integration tests
        if: matrix.matrix == 'integration'
        run: |
          uv run pytest tests/integration
